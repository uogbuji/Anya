[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'anya'
dynamic = ['version']
description = 'Headless LLM agent runner: scheduled jobs, skills/flows, email reports, blotter (Claude, OpenAI-compatible)'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'anthropic>=0.50',
    'filelock>=3.15',
    'openai>=1.0',
    'httpx>=0.28',
    'hishel[httpx]>=2.0',  # RFC 9111 HTTP cache for httpx (ETag / Last-Modified / Cache-Control)
    'structlog>=24.0',
    'tenacity>=9.0',
    'fire>=0.7',
    'rich>=13.0',
    'python-dotenv>=1.0',
    'feedparser>=6.0',
    'cssutils',  # CSS parsing for hidden-content removal in fetchers/_html.py
    'selectolax>=1.0.2',  # HTML parsing (lexbor backend) for fetchers/_html.py
    'wordloom>=0.10.1',  # Prompts file format (anya.loom.toml)
]

[project.optional-dependencies]
test = ['pytest>=8']

[project.scripts]
anya = 'anya.cli.main:main'

[tool.hatch.version]
path = 'pylib/__about__.py'

[tool.hatch.build.targets.wheel]
only-include = ['pylib']

[tool.hatch.build.sources]
'pylib' = 'anya'

[tool.pytest.ini_options]
# Only anya's own suite. Without this, pytest also collects tests under the
# gitignored job/ tree, so a clean checkout would run a different suite.
testpaths = ['test']
addopts = '-m "not integration"'
markers = [
    'integration: touches unowned code or live services (DB, HTTP, browser); excluded from the default run',
]
