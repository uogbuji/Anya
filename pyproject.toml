[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'anya'
dynamic = ['version']
description = 'Headless LLM agent runner: scheduled jobs, skills/flows, email reports, blotter (Claude, OpenAI-compatible)'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'anthropic>=0.50',
    'filelock>=3.15',
    'openai>=1.0',
    'httpx>=0.28',
    'hishel[httpx]>=1.2',  # RFC 9111 HTTP cache for httpx (ETag / Last-Modified / Cache-Control)
    'structlog>=24.0',
    'tenacity>=9.0',
    'fire>=0.7',
    'rich>=13.0',
    'python-dotenv>=1.0',
    'feedparser>=6.0',
    'cssutils',  # Used by ogbujipt.text.html for CSS parsing
    # Lightweight HTML→Markdown profile (clean_html, html2markdown) — pinned to git main
    # until released; the PyPI build dragged in torch/transformers/tiktoken (multi-GB).
    'ogbujipt @ git+https://github.com/OoriData/OgbujiPT.git@main',
    # Required by ogbujipt.text.html, which still imports the Modest backend (selectolax.parser)
    # that selectolax 1.0 removed. Lift the cap once OgbujiPT moves to selectolax.lexbor.
    'selectolax>=0.3,<1',
    'wordloom>=0.10.1',  # Prompts file format (anya.loom.toml)
]

[project.optional-dependencies]
scheduler-apscheduler = ['apscheduler>=3.10,<4']  # 4.x is a different API
test = ['pytest>=8']
all = ['anya[scheduler-apscheduler]']

[project.scripts]
anya = 'anya.cli.main:main'

# Allow the git-pinned ogbujipt direct reference until it's released to PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = 'pylib/__about__.py'

[tool.hatch.build.targets.wheel]
only-include = ['pylib']

[tool.hatch.build.sources]
'pylib' = 'anya'

[tool.pytest.ini_options]
# Only anya's own suite. Without this, pytest also collects tests under the
# gitignored job/ tree, so a clean checkout would run a different suite.
testpaths = ['test']
addopts = '-m "not integration"'
markers = [
    'integration: touches unowned code or live services (DB, HTTP, browser); excluded from the default run',
]
